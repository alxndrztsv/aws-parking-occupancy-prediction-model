name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 is the floor, not a preference: xgboost==3.4.1 declares
      # Requires-Python >=3.12, so on 3.11 the install step below fails outright.
      # The Lambda runtime stays 3.11 - neither Lambda needs xgboost.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # requirements-dev.txt pulls in sagemaker/requirements.txt via -r, and the
          # cache key only hashes the paths listed here, so both must be named.
          cache-dependency-path: |
            requirements-dev.txt
            sagemaker/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        run: pytest

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color
