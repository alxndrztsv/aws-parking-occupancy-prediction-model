name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write # OIDC federation with the bootstrap GitHub provider
  contents: read

concurrency:
  group: cd-deploy
  cancel-in-progress: false

env:
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
  TF_VAR_environment: ${{ vars.ENVIRONMENT }}
  TF_VAR_failure_notification_email: ${{ secrets.FAILURE_NOTIFICATION_EMAIL }}
  TF_VAR_model_approval_email: ${{ secrets.MODEL_APPROVAL_EMAIL }}
  TF_VAR_api_url: ${{ secrets.API_URL }}
  TF_VAR_api_city_code: ${{ secrets.API_CITY_CODE }}
  TF_VAR_api_login: ${{ secrets.API_LOGIN }}
  TF_VAR_api_password: ${{ secrets.API_PASSWORD }}

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan -input=false -no-color -out=tfplan
          {
            echo '### terraform plan'
            echo '```'
            terraform show -no-color tfplan | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          if-no-files-found: error

      # archive_file builds the three Lambda zips during plan, and the provider
      # re-reads them from disk to upload at apply time. Applying a saved plan does
      # not re-run data sources, so the zips have to travel to the next runner.
      # The directory must not start with a dot: upload-artifact globs with dot=false
      # and silently skips hidden paths, which surfaces much later as
      # "Artifact not found for name: lambda-zips" in the apply job.
      # if-no-files-found: error makes an empty upload fail HERE instead.
      - name: Upload lambda packages
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zips
          path: terraform/build
          if-no-files-found: error

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Download lambda packages
        uses: actions/download-artifact@v4
        with:
          name: lambda-zips
          path: terraform/build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -input=false tfplan

      # Not a Terraform resource: the archive spans sagemaker/, src/ and configs/,
      # which no single archive_file source_dir can express. Uploaded after apply
      # because the bucket only exists once apply has created it.
      - name: Build SageMaker training archive
        run: bash scripts/build_sagemaker_package.sh dist/train.tar.gz

      - name: Upload training archive
        working-directory: terraform
        run: |
          BUCKET="$(terraform output -raw artifacts_bucket)"
          aws s3 cp ../dist/train.tar.gz "s3://$BUCKET/code/train.tar.gz"
          echo "Uploaded to s3://$BUCKET/code/train.tar.gz"

      - name: Show outputs
        working-directory: terraform
        run: terraform output -no-color
