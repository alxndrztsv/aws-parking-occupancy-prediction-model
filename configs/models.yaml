# Hyperparameters for estimators trained by src/models/train_models.py.
#
# random_state and early_stopping_rounds are shared: random_state is injected
# into every estimator, early_stopping_rounds drives the early stopping callback.
random_state: 42
early_stopping_rounds: 50

models:
  lightgbm:
    objective: regression_l1
    metric: mae
    device_type: cpu
    boosting_type: gbdt
    n_estimators: 1500
    learning_rate: 0.03
    num_leaves: 63
    max_depth: 8
    min_child_samples: 50
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    n_jobs: -1
    max_bin: 255
    force_row_wise: true
    min_data_per_group: 100
    cat_smooth: 10.0
    cat_l2: 10.0

  xgboost:
    objective: reg:absoluteerror
    eval_metric: mae
    tree_method: hist
    device: cpu # cuda
    enable_categorical: true
    n_estimators: 1500
    learning_rate: 0.03
    max_depth: 7
    min_child_weight: 10
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    n_jobs: -1

  catboost:
    loss_function: MAE
    eval_metric: MAE
    iterations: 1500
    learning_rate: 0.03
    depth: 7
    l2_leaf_reg: 3.0
    # CPU by default for every library; ML_DEVICE=gpu switches all three at once.
    task_type: CPU
    thread_count: -1

  ensemble:
    models:
      - lightgbm
      - xgboost
      - catboost
    weights:
      lightgbm: 1.0
      xgboost: 1.0
      catboost: 1.0
